<!-- Main Sticky Header -->
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="brand-logo">
      <span class="logo-icon">🚁</span>
      <div class="brand-text">
        <span class="brand-title">{{ .Site.Params.brand.name }}</span>
        <span class="brand-sub">FPV RESIDENTIAL INCURSIONS</span>
      </div>
    </a>

    <nav class="main-nav">
      {{ $currentPage := . }}
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="nav-link {{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) (eq $currentPage.RelPermalink .URL) }}active{{ end }}">
          {{ .Name }}
        </a>
      {{ end }}
      <a href="/emergency-dispatch/" class="btn btn-primary mobile-nav-cta">
        ⚡ Dispatch Drone
      </a>
    </nav>

    <a href="/emergency-dispatch/" class="btn btn-primary header-cta">
      ⚡ Dispatch Drone
    </a>

    <button class="mobile-menu-toggle" aria-label="Toggle Navigation Menu">☰</button>
  </div>
</header>
