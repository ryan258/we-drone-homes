<a class="skip-link" href="#main">Skip to content</a>
{{ if not .IsHome }}
  <div class="notice-bar"><div class="container"><span>A fictional real estate drone agency</span></div></div>
{{ end }}
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="We Drone Homes, home">{{ partial "mark.html" "primary" }}</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu <span aria-hidden="true">＋</span></button>
    <nav id="main-nav" class="main-nav" aria-label="Main navigation">
      {{ $current := . }}{{ range .Site.Menus.main }}
        {{ $href := .URL }}
        <a href="{{ $href }}"{{ if eq $current.RelPermalink $href }} aria-current="page"{{ else if and (ne .URL "/") (hasPrefix $current.RelPermalink $href) }} aria-current="true"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a href="{{ "emergency-dispatch/" | relURL }}" class="button button-dark nav-cta"{{ if eq .Section "emergency-dispatch" }} aria-current="page"{{ end }}>Mock booking {{ partial "glyph.html" "dispatch" }}</a>
    </nav>
  </div>
</header>
