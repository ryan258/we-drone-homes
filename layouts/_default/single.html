{{ define "main" }}
<section class="section">
  <div class="container container-narrow">
    <div class="section-header">
      <span class="section-tag">CLASSIFIED BRIEFING</span>
      <h1 class="section-title">{{ .Title }}</h1>
    </div>
    <div style="padding: 2.5rem; background: rgba(15, 19, 28, 0.7); border: 1px solid #1f2738; border-radius: 8px; color: #8a99b5; line-height: 1.8;">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
