<!doctype html>
<html lang="en">
<head>{{ partial "head.html" . }}</head>
<body id="top">
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ $script := resources.Get "js/site.js" | minify | fingerprint }}<script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
  {{ if eq .Section "soundboard" }}{{ $audio := resources.Get "js/soundboard.js" | minify | fingerprint }}<script src="{{ $audio.RelPermalink }}" defer></script>{{ end }}
</body>
</html>
