baseURL: "/"
locale: "en-US"
title: "We Drone Homes — Killer views. Unfortunate name."
enableRobotsTXT: true
params:
  description: "A fictional real estate drone agency. Tour imaginary properties and follow their illustrated flight paths."
  featuredReport: /listings/mcmansion-monolith/
menus:
  main:
    - name: Our work
      url: /listings/
      weight: 10
    - name: Packages
      url: /packages/
      weight: 20
    - name: The crew
      url: /pilots/
      weight: 30
    - name: Our story
      url: /about/
      weight: 40
    - name: FAQs
      url: /faq/
      weight: 50

disableKinds: ["taxonomy", "term"]

module:
  mounts:
    - source: assets
      target: assets
    - source: brand/identity
      target: assets/brand/identity
    - source: brand/art
      target: assets/brand/art
    - source: brand/campaign
      target: assets/brand/campaign
