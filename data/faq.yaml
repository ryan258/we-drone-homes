- question: Is We Drone Homes a real agency?
  answer: We Drone Homes is a fictional real estate drone agency and an interactive comedy project. Mock booking creates a brief in your browser that you can save. It does not send a request, schedule a flight, or take a payment.
- question: Why did you call it We Drone Homes?
  answer: We had the drones. We photographed homes. Nobody read the name out loud until the van was wrapped.
- question: What can I do on the site?
  answer: Explore four fictional properties, play their illustrated flight routes, meet the pilots, and make a mock flight brief. The drywall calculator itemizes your imaginary contingency spackle.
- question: Which fictional packages include interiors?
  answer: The Full Breach and The Hero Exit include an interior fly-through in their fictional shot lists. The Gentle Orbit stays outside. The front door can remain closed.
- question: What does the crew put on a shot list?
  answer: The rooms that explain the layout, the time when the light is best, and any obstacle the camera would rather meet in a briefing. The cat gets its own line.
- question: Can you make a room look bigger?
  answer: A good angle can show how a room fits the layout. Turning a breakfast nook into a ballroom is still the listing description’s department.
- question: What happens if the weather turns?
  answer: In the fictional brief, we pick a different light window. The patio furniture has already made its own arrangements.
